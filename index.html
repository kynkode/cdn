<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Eternity Matrix | 2126</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#10b981',
                            600: '#059669',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for a sleeker look */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .truncate-url { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 text-xl font-bold text-white">
                <i class="fa-solid fa-infinity text-brand-500"></i>
                URL Eternity Matrix
                <span class="bg-brand-500/20 text-brand-500 text-xs px-2 py-1 rounded-full uppercase tracking-wider">Year 2126</span>
            </div>
            <div class="flex gap-2">
                <button onclick="fetchLinks()" id="btn-refresh" class="bg-slate-800 hover:bg-slate-700 text-sm px-4 py-2 rounded-lg transition flex items-center gap-2 border border-slate-700">
                    <i class="fa-solid fa-rotate"></i> Load Links
                </button>
                <button onclick="monitorHealth()" id="btn-health" class="bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 text-sm px-4 py-2 rounded-lg transition flex items-center gap-2 border border-blue-900/50">
                    <i class="fa-solid fa-heart-pulse"></i> Monitor Health
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full space-y-8">
        
        <!-- Add Link Section -->
        <section class="bg-slate-800/50 border border-slate-700 rounded-xl p-6 shadow-lg">
            <h2 class="text-lg font-semibold mb-4 text-white flex items-center gap-2">
                <i class="fa-solid fa-link"></i> Process New URL
            </h2>
            <form id="add-link-form" class="flex flex-col md:flex-row gap-4" onsubmit="addLink(event)">
                <input 
                    type="url" 
                    id="url-input" 
                    required 
                    placeholder="https://example.com/file?expire=1672531199..." 
                    class="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition placeholder-slate-500"
                >
                <button type="submit" id="btn-submit" class="bg-brand-600 hover:bg-brand-500 text-white font-medium px-6 py-3 rounded-lg transition flex items-center justify-center gap-2 whitespace-nowrap shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Extend to 2126
                </button>
            </form>
            <p class="text-xs text-slate-400 mt-3">
                <i class="fa-solid fa-circle-info mr-1"></i> Ensure the URL contains the <code>expire=...</code> tag for the backend to update it correctly.
            </p>
        </section>

        <!-- Status / Notifications -->
        <div id="notification-area" class="hidden rounded-lg p-4 text-sm font-medium transition-all duration-300"></div>

        <!-- Links Grid -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-database"></i> Database Records
                </h2>
                <span id="record-count" class="text-sm text-slate-400">0 records</span>
            </div>

            <!-- Empty State / Loading State -->
            <div id="links-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-full py-12 text-center text-slate-500 bg-slate-800/30 rounded-xl border border-slate-700 border-dashed">
                    <i class="fa-solid fa-satellite-dish text-3xl mb-3 opacity-50"></i>
                    <p>No records loaded. Click "Load Links" to fetch from database.</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Scripts -->
    <script>
        // Configuration
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbxzbFu2TmAa8tbxR7s8dksTu3Y2rosqPQ2oLE7oDJetU2t4hNIp_hIdzlHB51NuP3l_/exec",
            API_SECRET: "0fc86192dc7fd8bfd7a0deab68571d324c015600c5c3861fa85622c7f2769feb"
        };

        // UI Helpers
        const showNotification = (message, type = 'success') => {
            const el = document.getElementById('notification-area');
            el.className = `p-4 rounded-lg text-sm font-medium mb-4 flex items-center gap-2 shadow-lg animate-fade-in ${
                type === 'success' ? 'bg-brand-500/10 text-brand-400 border border-brand-500/20' : 
                type === 'error' ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 
                'bg-blue-500/10 text-blue-400 border border-blue-500/20'
            }`;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info';
            el.innerHTML = `<i class="fa-solid ${icon}"></i> ${message}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        };

        const setLoading = (buttonId, isLoading, originalText, iconClass) => {
            const btn = document.getElementById(buttonId);
            if (isLoading) {
                btn.disabled = true;
                btn.classList.add('opacity-75', 'cursor-not-allowed');
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                btn.innerHTML = `<i class="fa-solid ${iconClass}"></i> ${originalText}`;
            }
        };

        const copyToClipboard = async (text, btnElement) => {
            try {
                await navigator.clipboard.writeText(text);
                const originalHTML = btnElement.innerHTML;
                btnElement.innerHTML = `<i class="fa-solid fa-check text-brand-500"></i>`;
                setTimeout(() => btnElement.innerHTML = originalHTML, 2000);
            } catch (err) {
                console.error('Failed to copy', err);
            }
        };

        // HMAC-SHA256 Implementation via Web Crypto API
        async function generateSignature(action, payload, timestamp) {
            const dataToSign = action + JSON.stringify(payload) + timestamp.toString();
            const encoder = new TextEncoder();
            
            const key = await crypto.subtle.importKey(
                "raw",
                encoder.encode(CONFIG.API_SECRET),
                { name: "HMAC", hash: "SHA-256" },
                false,
                ["sign"]
            );

            const signatureBuffer = await crypto.subtle.sign(
                "HMAC",
                key,
                encoder.encode(dataToSign)
            );

            // Convert buffer to hex string
            return Array.from(new Uint8Array(signatureBuffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        // Core API Caller
        async function apiCall(action, payload = {}) {
            const timestamp = Date.now();
            const signature = await generateSignature(action, payload, timestamp);

            const requestBody = {
                action,
                payload,
                timestamp,
                signature
            };

            try {
                // 'text/plain' prevents CORS preflight OPTIONS request block on GAS
                const response = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(requestBody),
                    redirect: 'follow'
                });

                const data = await response.json();
                if (data.status === 'error') throw new Error(data.message);
                return data.data;
            } catch (error) {
                console.error("API Error:", error);
                throw error;
            }
        }

        // Action Handlers
        async function addLink(e) {
            e.preventDefault();
            const urlInput = document.getElementById('url-input').value.trim();
            if (!urlInput) return;

            setLoading('btn-submit', true, 'Extend to 2126', 'fa-wand-magic-sparkles');

            // Extract expiry if exists to send as payload metadata
            const expireMatch = urlInput.match(/expire=(\d+)/);
            const originalExpiry = expireMatch ? expireMatch[1] : 'UNKNOWN';

            try {
                const result = await apiCall('ADD_LINK', { 
                    url: urlInput,
                    expiry: originalExpiry
                });
                
                showNotification('URL successfully processed and encrypted in database.', 'success');
                document.getElementById('url-input').value = '';
                
                // Refresh list automatically
                fetchLinks();
            } catch (error) {
                showNotification(`Failed to add link: ${error.message}`, 'error');
            } finally {
                setLoading('btn-submit', false, 'Extend to 2126', 'fa-wand-magic-sparkles');
            }
        }

        async function fetchLinks() {
            setLoading('btn-refresh', true, 'Load Links', 'fa-rotate');
            try {
                const links = await apiCall('GET_LINKS');
                renderLinks(links);
                showNotification('Database synchronized.', 'info');
            } catch (error) {
                showNotification(`Failed to load links: ${error.message}`, 'error');
            } finally {
                setLoading('btn-refresh', false, 'Load Links', 'fa-rotate');
            }
        }

        async function monitorHealth() {
            setLoading('btn-health', true, 'Monitor Health', 'fa-heart-pulse');
            try {
                const stats = await apiCall('MONITOR_HEALTH');
                showNotification(`Health check complete: ${stats.alive} Active, ${stats.dead} Dead.`, 'success');
                fetchLinks(); // Reload to show updated statuses
            } catch (error) {
                showNotification(`Health check failed: ${error.message}`, 'error');
            } finally {
                setLoading('btn-health', false, 'Monitor Health', 'fa-heart-pulse');
            }
        }

        // DOM Rendering
        function getStatusBadge(status) {
            if (status === 'ACTIVE') return `<span class="px-2 py-1 bg-green-500/10 text-green-400 border border-green-500/20 rounded text-xs font-semibold tracking-wide">ACTIVE</span>`;
            if (status === 'DEAD') return `<span class="px-2 py-1 bg-red-500/10 text-red-400 border border-red-500/20 rounded text-xs font-semibold tracking-wide">DEAD</span>`;
            if (status === 'REFRESHED') return `<span class="px-2 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded text-xs font-semibold tracking-wide">REFRESHED</span>`;
            return `<span class="px-2 py-1 bg-slate-700 text-slate-300 rounded text-xs">${status || 'UNKNOWN'}</span>`;
        }

        function renderLinks(links) {
            const container = document.getElementById('links-container');
            const count = document.getElementById('record-count');
            
            count.innerText = `${links.length} record${links.length !== 1 ? 's' : ''}`;
            
            if (links.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center text-slate-500 bg-slate-800/30 rounded-xl border border-slate-700 border-dashed">
                        <i class="fa-solid fa-box-open text-3xl mb-3 opacity-50"></i>
                        <p>Database is empty.</p>
                    </div>`;
                return;
            }

            container.innerHTML = links.reverse().map(link => `
                <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-5 hover:border-slate-600 transition-colors shadow-sm group">
                    <div class="flex justify-between items-start mb-3">
                        <div class="text-xs text-slate-400 font-mono flex items-center gap-2">
                            <i class="fa-solid fa-fingerprint"></i> ID: ${link.id.substring(0,8)}...
                        </div>
                        ${getStatusBadge(link.status)}
                    </div>
                    
                    <div class="space-y-3">
                        <!-- Original URL -->
                        <div>
                            <p class="text-xs text-slate-400 mb-1 uppercase tracking-wider font-semibold">Original URL (Exp: ${link.expiry})</p>
                            <div class="flex items-center bg-slate-900/50 rounded border border-slate-700/50 p-2">
                                <a href="${link.originalUrl}" target="_blank" class="text-sm text-slate-300 hover:text-brand-400 truncate-url transition" title="${link.originalUrl}">
                                    ${link.originalUrl}
                                </a>
                            </div>
                        </div>

                        <!-- 2126 URL -->
                        <div>
                            <p class="text-xs text-brand-500 mb-1 uppercase tracking-wider font-semibold flex items-center gap-1">
                                <i class="fa-solid fa-infinity"></i> Year 2126 URL
                            </p>
                            <div class="flex items-center gap-2">
                                <div class="flex-grow bg-brand-900/20 rounded border border-brand-500/30 p-2 overflow-hidden">
                                    <a href="${link.updatedUrl}" target="_blank" class="text-sm text-brand-300 hover:text-brand-400 truncate-url transition" title="${link.updatedUrl}">
                                        ${link.updatedUrl}
                                    </a>
                                </div>
                                <button onclick='copyToClipboard(${JSON.stringify(link.updatedUrl)}, this)' class="bg-slate-700 hover:bg-slate-600 text-slate-300 p-2 rounded transition flex-shrink-0" title="Copy URL">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // Auto-load on init
        window.addEventListener('DOMContentLoaded', fetchLinks);
    </script>
</body>
</html>
