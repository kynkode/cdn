<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wootly Auto-Updater Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#3b82f6', // Changed to blue theme for 'refresh' vibe
                            600: '#2563eb',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .truncate-url { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 text-xl font-bold text-white">
                <i class="fa-solid fa-network-wired text-brand-500"></i>
                Wootly Link Matrix
                <span class="bg-brand-500/20 text-brand-500 text-xs px-2 py-1 rounded-full uppercase tracking-wider">Auto-Scraper</span>
            </div>
            <div class="flex gap-2">
                <button onclick="fetchLinks()" id="btn-refresh" class="bg-slate-800 hover:bg-slate-700 text-sm px-4 py-2 rounded-lg transition flex items-center gap-2 border border-slate-700">
                    <i class="fa-solid fa-rotate"></i> Load Links
                </button>
                <button onclick="monitorHealth()" id="btn-health" class="bg-brand-600/20 text-brand-400 hover:bg-brand-600/30 text-sm px-4 py-2 rounded-lg transition flex items-center gap-2 border border-brand-900/50">
                    <i class="fa-solid fa-heart-pulse"></i> Monitor Health
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full space-y-8">
        
        <!-- Add Link Section -->
        <section class="bg-slate-800/50 border border-slate-700 rounded-xl p-6 shadow-lg">
            <h2 class="text-lg font-semibold mb-4 text-white flex items-center gap-2">
                <i class="fa-solid fa-link"></i> Add Link to Auto-Updater
            </h2>
            <form id="add-link-form" class="flex flex-col gap-4" onsubmit="addLink(event)">
                
                <div class="flex flex-col md:flex-row gap-4">
                    <!-- Source URL Input -->
                    <div class="flex-grow">
                        <label class="block text-xs text-slate-400 font-semibold mb-1 uppercase">Source Webpage URL (Where the video is hosted)</label>
                        <input 
                            type="url" 
                            id="source-url-input" 
                            required 
                            placeholder="https://example-movie-site.com/watch/123" 
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition placeholder-slate-500"
                        >
                    </div>

                    <!-- Wootly URL Input -->
                    <div class="flex-grow">
                        <label class="block text-xs text-slate-400 font-semibold mb-1 uppercase">Current Wootly URL</label>
                        <input 
                            type="url" 
                            id="wootly-url-input" 
                            required 
                            placeholder="https://www.wootly.com/file?expire=..." 
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition placeholder-slate-500"
                        >
                    </div>
                </div>

                <div class="flex justify-end mt-2">
                    <button type="submit" id="btn-submit" class="bg-brand-600 hover:bg-brand-500 text-white font-medium px-6 py-3 rounded-lg transition flex items-center justify-center gap-2 shadow-lg shadow-brand-500/20 w-full md:w-auto">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Save & Monitor
                    </button>
                </div>
            </form>
            <p class="text-xs text-slate-400 mt-4">
                <i class="fa-solid fa-circle-info mr-1"></i> The backend requires the <b>Source URL</b> so it knows where to scrape a fresh link when the current Wootly link expires.
            </p>
        </section>

        <!-- Status / Notifications -->
        <div id="notification-area" class="hidden rounded-lg p-4 text-sm font-medium transition-all duration-300"></div>

        <!-- Links Grid -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-database"></i> Monitored Records
                </h2>
                <span id="record-count" class="text-sm text-slate-400">0 records</span>
            </div>

            <!-- Container for Cards -->
            <div id="links-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-full py-12 text-center text-slate-500 bg-slate-800/30 rounded-xl border border-slate-700 border-dashed">
                    <i class="fa-solid fa-satellite-dish text-3xl mb-3 opacity-50"></i>
                    <p>No records loaded. Click "Load Links" to fetch from database.</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Scripts -->
    <script>
        // Configuration
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbzfo7aGW4IO6k4hxE0QE0cZ2Yt__mNjxgVCJpGqd57VfDJ_xj8aaevOcSFVEiVroRda/exec", // <-- CHANGE THIS!
            API_SECRET: "0fc86192dc7fd8bfd7a0deab68571d324c015600c5c3861fa85622c7f2769feb"
        };

        // UI Helpers
        const showNotification = (message, type = 'success') => {
            const el = document.getElementById('notification-area');
            el.className = `p-4 rounded-lg text-sm font-medium mb-4 flex items-center gap-2 shadow-lg animate-fade-in ${
                type === 'success' ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 
                type === 'error' ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 
                'bg-brand-500/10 text-brand-400 border border-brand-500/20'
            }`;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info';
            el.innerHTML = `<i class="fa-solid ${icon}"></i> ${message}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        };

        const setLoading = (buttonId, isLoading, originalText, iconClass) => {
            const btn = document.getElementById(buttonId);
            if (isLoading) {
                btn.disabled = true;
                btn.classList.add('opacity-75', 'cursor-not-allowed');
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                btn.innerHTML = `<i class="fa-solid ${iconClass}"></i> ${originalText}`;
            }
        };

        const copyToClipboard = async (text, btnElement) => {
            try {
                await navigator.clipboard.writeText(text);
                const originalHTML = btnElement.innerHTML;
                btnElement.innerHTML = `<i class="fa-solid fa-check text-green-500"></i>`;
                setTimeout(() => btnElement.innerHTML = originalHTML, 2000);
            } catch (err) {
                console.error('Failed to copy', err);
            }
        };

        // HMAC-SHA256 Implementation via Web Crypto API
        async function generateSignature(action, payload, timestamp) {
            const dataToSign = action + JSON.stringify(payload) + timestamp.toString();
            const encoder = new TextEncoder();
            
            const key = await crypto.subtle.importKey(
                "raw",
                encoder.encode(CONFIG.API_SECRET),
                { name: "HMAC", hash: "SHA-256" },
                false,
                ["sign"]
            );

            const signatureBuffer = await crypto.subtle.sign(
                "HMAC",
                key,
                encoder.encode(dataToSign)
            );

            return Array.from(new Uint8Array(signatureBuffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        // Core API Caller
        async function apiCall(action, payload = {}) {
            const timestamp = Date.now();
            const signature = await generateSignature(action, payload, timestamp);

            const requestBody = { action, payload, timestamp, signature };

            try {
                const response = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(requestBody),
                    redirect: 'follow'
                });

                const data = await response.json();
                if (data.status === 'error') throw new Error(data.message);
                return data.data;
            } catch (error) {
                console.error("API Error:", error);
                throw error;
            }
        }

        // --- ACTION HANDLERS ---

        async function addLink(e) {
            e.preventDefault();
            const sourceUrlInput = document.getElementById('source-url-input').value.trim();
            const wootlyUrlInput = document.getElementById('wootly-url-input').value.trim();
            if (!sourceUrlInput || !wootlyUrlInput) return;

            setLoading('btn-submit', true, 'Save & Monitor', 'fa-cloud-arrow-up');

            const expireMatch = wootlyUrlInput.match(/expire=(\d+)/);
            const originalExpiry = expireMatch ? expireMatch[1] : 'UNKNOWN';

            try {
                await apiCall('ADD_LINK', { 
                    sourceUrl: sourceUrlInput,
                    wootlyUrl: wootlyUrlInput,
                    expiry: originalExpiry
                });
                
                showNotification('URLs successfully saved and encrypted in database.', 'success');
                document.getElementById('source-url-input').value = '';
                document.getElementById('wootly-url-input').value = '';
                
                fetchLinks();
            } catch (error) {
                showNotification(`Failed to add link: ${error.message}`, 'error');
            } finally {
                setLoading('btn-submit', false, 'Save & Monitor', 'fa-cloud-arrow-up');
            }
        }

        async function fetchLinks() {
            setLoading('btn-refresh', true, 'Load Links', 'fa-rotate');
            try {
                const links = await apiCall('GET_LINKS');
                renderLinks(links);
            } catch (error) {
                showNotification(`Failed to load links: ${error.message}`, 'error');
            } finally {
                setLoading('btn-refresh', false, 'Load Links', 'fa-rotate');
            }
        }

        async function monitorHealth() {
            setLoading('btn-health', true, 'Monitor Health', 'fa-heart-pulse');
            try {
                const stats = await apiCall('MONITOR_HEALTH');
                showNotification(`Health check complete: ${stats.alive} Active, ${stats.dead} Dead.`, 'success');
                fetchLinks(); 
            } catch (error) {
                showNotification(`Health check failed: ${error.message}`, 'error');
            } finally {
                setLoading('btn-health', false, 'Monitor Health', 'fa-heart-pulse');
            }
        }

        // NEW: Manual Real-Time Update Fetcher
        async function requestLinkUpdate(id, sourceUrl, btnElement) {
            const originalHtml = btnElement.innerHTML;
            btnElement.disabled = true;
            btnElement.classList.add('opacity-50', 'cursor-not-allowed');
            btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Scraping...`;

            try {
                await apiCall('UPDATE_LINK', { id: id, sourceUrl: sourceUrl });
                showNotification('Link successfully scraped and updated!', 'success');
                fetchLinks(); // Reload the grid to show the new URL
            } catch (error) {
                showNotification(`Update failed: ${error.message}`, 'error');
                btnElement.innerHTML = originalHtml;
                btnElement.disabled = false;
                btnElement.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // --- DOM RENDERING ---

        function getStatusBadge(status) {
            if (status === 'ACTIVE') return `<span class="px-2 py-1 bg-green-500/10 text-green-400 border border-green-500/20 rounded text-xs font-semibold tracking-wide">ACTIVE</span>`;
            if (status === 'DEAD') return `<span class="px-2 py-1 bg-red-500/10 text-red-400 border border-red-500/20 rounded text-xs font-semibold tracking-wide">DEAD</span>`;
            if (status === 'UPDATED' || status === 'AUTO-REFRESHED') return `<span class="px-2 py-1 bg-brand-500/10 text-brand-400 border border-brand-500/20 rounded text-xs font-semibold tracking-wide">${status}</span>`;
            return `<span class="px-2 py-1 bg-slate-700 text-slate-300 rounded text-xs">${status || 'UNKNOWN'}</span>`;
        }

        function renderLinks(links) {
            const container = document.getElementById('links-container');
            const count = document.getElementById('record-count');
            
            count.innerText = `${links.length} record${links.length !== 1 ? 's' : ''}`;
            
            if (links.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center text-slate-500 bg-slate-800/30 rounded-xl border border-slate-700 border-dashed">
                        <i class="fa-solid fa-box-open text-3xl mb-3 opacity-50"></i>
                        <p>Database is empty.</p>
                    </div>`;
                return;
            }

            container.innerHTML = links.reverse().map(link => `
                <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-5 hover:border-slate-600 transition-colors shadow-sm flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <div class="text-xs text-slate-400 font-mono flex items-center gap-2">
                                <i class="fa-solid fa-fingerprint"></i> ID: ${link.id.substring(0,8)}
                            </div>
                            ${getStatusBadge(link.status)}
                        </div>
                        
                        <div class="space-y-4">
                            <!-- Source URL -->
                            <div>
                                <p class="text-xs text-slate-400 mb-1 uppercase tracking-wider font-semibold flex items-center gap-2">
                                    <i class="fa-solid fa-globe"></i> Source Webpage
                                </p>
                                <div class="bg-slate-900/50 rounded border border-slate-700/50 p-2">
                                    <a href="${link.sourceUrl}" target="_blank" class="text-sm text-slate-300 hover:text-brand-400 truncate-url transition" title="${link.sourceUrl}">
                                        ${link.sourceUrl}
                                    </a>
                                </div>
                            </div>

                            <!-- Active Wootly URL -->
                            <div>
                                <p class="text-xs text-brand-400 mb-1 uppercase tracking-wider font-semibold flex items-center gap-2">
                                    <i class="fa-solid fa-play"></i> Active Wootly Link
                                </p>
                                <div class="flex items-center gap-2">
                                    <div class="flex-grow bg-brand-900/10 rounded border border-brand-500/30 p-2 overflow-hidden">
                                        <a href="${link.activeWootlyUrl}" target="_blank" class="text-sm text-brand-300 hover:text-brand-400 truncate-url transition" title="${link.activeWootlyUrl}">
                                            ${link.activeWootlyUrl}
                                        </a>
                                    </div>
                                    <button onclick='copyToClipboard(${JSON.stringify(link.activeWootlyUrl)}, this)' class="bg-slate-700 hover:bg-slate-600 text-slate-300 p-2 rounded transition flex-shrink-0" title="Copy URL">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                </div>
                                <div class="text-[10px] text-slate-500 mt-1 text-right">Raw Expiry Code: ${link.expiry}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Update Action -->
                    <div class="mt-5 pt-4 border-t border-slate-700/50 flex justify-end">
                        <button onclick="requestLinkUpdate('${link.id}', '${link.sourceUrl}', this)" class="bg-brand-600/20 hover:bg-brand-600/40 text-brand-400 text-sm px-4 py-2 rounded transition flex items-center gap-2 border border-brand-500/30">
                            <i class="fa-solid fa-rotate-right"></i> Scrape Fresh Link
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        // Auto-load on init
        window.addEventListener('DOMContentLoaded', fetchLinks);
    </script>
</body>
</html>
