<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Trust CDN Automator</title>
    <style>
        :root {
            --bg-blue: #0b0d40;
            --card-blue: #141979; /* Requested Deep Blue */
            --accent-orange: #ff6600; /* Futuristic Orange */
            --accent-glow: rgba(255, 102, 0, 0.4);
            --text-main: #e0e6ed;
            --text-muted: #8892b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace; /* Tech feel */
        }

        body {
            background-color: var(--bg-blue);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(20, 25, 121, 0.8) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 102, 0, 0.15) 0%, transparent 20%);
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            margin-bottom: 40px;
            text-align: center;
            border-bottom: 2px solid var(--accent-orange);
            padding-bottom: 20px;
            box-shadow: 0 10px 30px -15px var(--accent-glow);
        }

        h1 {
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .panel {
            background-color: var(--card-blue);
            border: 1px solid rgba(255, 102, 0, 0.3);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-orange), transparent);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-orange);
            font-weight: bold;
            font-size: 0.9em;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--text-muted);
            color: white;
            border-radius: 4px;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        button {
            background-color: transparent;
            color: var(--accent-orange);
            border: 2px solid var(--accent-orange);
            padding: 12px 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--accent-orange);
            color: var(--bg-blue);
            box-shadow: 0 0 15px var(--accent-orange);
        }

        .terminal {
            background: #000;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid var(--accent-orange);
            font-size: 0.85em;
            color: #0f0;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .data-table th, .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-table th {
            color: var(--accent-orange);
            text-transform: uppercase;
            font-size: 0.85em;
        }

        .status-active { color: #00ff00; }
        .status-refreshed { color: #00ffff; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Zero-Trust CDN Automator</h1>
        <p>E2E Encrypted • HMAC-SHA256 Auth • Multi-Tab DB Tracking</p>
    </header>

    <div class="panel">
        <h2>Inject New Link Endpoint</h2>
        <br>
        <label>Target URL (Base CDN Link)</label>
        <input type="text" id="urlInput" placeholder="https://web.wootly.ch/source?id=...&expire=1785403180">
        
        <label>Current Expiry (Unix Timestamp)</label>
        <input type="number" id="expiryInput" placeholder="1785403180">

        <button onclick="submitLink()">Encrypt & Inject</button>
    </div>

    <div class="panel">
        <h2>Active Link Matrix <button style="float:right; padding: 5px 10px; font-size: 0.8em;" onclick="fetchLinks()">Sync DB</button></h2>
        <table class="data-table" id="linksTable">
            <thead>
                <tr>
                    <th>Hash ID</th>
                    <th>Target</th>
                    <th>Expiry Time</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="linksBody">
                <!-- Data populated by JS -->
            </tbody>
        </table>
    </div>

    <div class="panel">
        <h2>System Terminal Logs</h2>
        <div class="terminal" id="terminal">
            [System] Core initialized. Waiting for secure inputs...<br>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    // MUST MATCH THE APPS SCRIPT WEB APP URL
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxhGOgWuYpKbqR4ZKCixSY3sj78nTj6vkxDGCyFhJiv_nsh94dxBAleRIJVsnKefwXm/exec";
    // MUST MATCH THE BACKEND SECRET
    const API_SECRET = "0fc86192dc7fd8bfd7a0deab68571d324c015600c5c3861fa85622c7f2769feb";

    /**
     * UTILITY: System Logger
     */
    function logMessage(msg) {
        const terminal = document.getElementById('terminal');
        const time = new Date().toLocaleTimeString();
        terminal.innerHTML += `[${time}] ${msg}<br>`;
        terminal.scrollTop = terminal.scrollHeight;
    }

    /**
     * CRYPTOGRAPHY: Generate HMAC-SHA256 Signature using Web Crypto API
     */
    async function generateHMAC(action, payload, timestamp) {
        const dataStr = action + JSON.stringify(payload) + timestamp.toString();
        
        const enc = new TextEncoder();
        const keyData = enc.encode(API_SECRET);
        const cryptoKey = await crypto.subtle.importKey(
            "raw", keyData, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
        );
        
        const signatureBuffer = await crypto.subtle.sign("HMAC", cryptoKey, enc.encode(dataStr));
        const hashArray = Array.from(new Uint8Array(signatureBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    /**
     * NETWORK: Securely execute fetch to backend
     */
    async function secureFetch(action, payload) {
        logMessage(`Initiating zero-trust protocol for action: ${action}`);
        const timestamp = new Date().getTime();
        
        // Generate cryptographic signature before sending
        const signature = await generateHMAC(action, payload, timestamp);
        logMessage(`Generated HMAC signature: ${signature.substring(0,10)}...`);

        const requestBody = {
            action: action,
            payload: payload,
            timestamp: timestamp,
            signature: signature
        };

        try {
            const response = await fetch(API_ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "text/plain" }, // GAS handles CORS best with text/plain
                body: JSON.stringify(requestBody)
            });

            const result = await response.json();
            if (result.status === "error") throw new Error(result.message);
            
            logMessage(`Request successful: 200 OK`);
            return result.data;
        } catch (error) {
            logMessage(`<span style="color:red">ERROR: ${error.message}</span>`);
            throw error;
        }
    }

    /**
     * ACTION: Submit new link to backend
     */
    async function submitLink() {
        const url = document.getElementById('urlInput').value;
        const expiry = document.getElementById('expiryInput').value;

        if (!url || !expiry) {
            logMessage('<span style="color:yellow">Warning: Missing parameters.</span>');
            return;
        }

        const payload = { url: url, expiry: parseInt(expiry) };
        
        try {
            const result = await secureFetch('ADD_LINK', payload);
            logMessage(`Successfully injected ID: ${result.id}`);
            document.getElementById('urlInput').value = '';
            document.getElementById('expiryInput').value = '';
            fetchLinks(); // Auto-refresh table
        } catch (e) {
            // Handled by secureFetch logger
        }
    }

    /**
     * ACTION: Fetch and populate links
     */
    async function fetchLinks() {
        try {
            const links = await secureFetch('GET_LINKS', {});
            const tbody = document.getElementById('linksBody');
            tbody.innerHTML = '';

            links.forEach(link => {
                const tr = document.createElement('tr');
                const dateStr = new Date(link.expiry * 1000).toLocaleString();
                
                // Truncate URL for display safety
                const safeUrl = link.url.substring(0, 30) + "...";
                const statusClass = link.status === "ACTIVE" ? "status-active" : "status-refreshed";

                tr.innerHTML = `
                    <td style="font-size: 0.8em; color: var(--text-muted)">${link.id.substring(0,8)}</td>
                    <td>${safeUrl}</td>
                    <td>${dateStr}</td>
                    <td class="${statusClass}">${link.status}</td>
                `;
                tbody.appendChild(tr);
            });
            logMessage(`Rendered ${links.length} active database entries.`);
        } catch (e) {
            // Handled by secureFetch logger
        }
    }

    // Auto-load table on startup
    window.onload = fetchLinks;
</script>

</body>
</html>
